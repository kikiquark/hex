<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="Настольная игра Hex против нейросети AlphaZero. Работает без интернета.">
  <title>Hex</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script type="module" crossorigin src="./assets/index-BqIumlyQ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-D5qvhRo0.css">
</head>
<body>
  <header>
    <h1>⬢ Hex</h1>
    <span id="modelInfo" class="muted"></span>
    <span class="tools">
      <button id="btnSound" class="icon-btn" type="button"></button>
      <button id="btnLang" class="icon-btn" type="button"></button>
    </span>
  </header>

  <main>
    <section class="play">
      <div id="roles" class="roles"></div>
      <svg id="board" role="img" aria-label="Игровое поле"></svg>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="actions">
        <button id="btnUndo" data-i18n="undo">↩ Отмена</button>
        <button id="btnHint" data-i18n="hint">💡 Подсказка</button>
        <button id="btnSwap" class="accent" hidden data-i18n="swap">🔄 Обмен</button>
      </div>
    </section>

    <aside>
      <div class="card">
        <h2 data-i18n="newGame">Новая игра</h2>
        <div class="label" data-i18n="size">Размер поля</div>
        <div id="optSize" class="chips"></div>
        <div class="label" data-i18n="color">Ваш цвет</div>
        <div id="optColor" class="chips"></div>
        <div class="label" data-i18n="opponent">Соперник</div>
        <div id="optLevel" class="chips"></div>
        <label class="toggle"><input id="optDev" type="checkbox"> <span data-i18n="devToggle">Все алгоритмы (для разработчика)</span></label>
        <div id="optDevBots" class="devbots"></div>
        <div id="levelNote" class="muted small"></div>
        <label class="toggle"><input id="optSwap" type="checkbox"> <span data-i18n="swapRule">Правило обмена</span></label>
        <button id="btnNew" class="primary" data-i18n="start">▶ Начать</button>
      </div>

      <div class="card">
        <h2 data-i18n="moves">Ходы</h2>
        <ol id="log" class="log"></ol>
      </div>

      <details class="card rules">
        <summary data-i18n="rules">Правила</summary>
        <p data-i18n-html="rules1"></p>
        <p data-i18n-html="rules2"></p>
      </details>
    </aside>
  </main>

  <details class="card help">
    <summary data-i18n="helpTitle">Справка: боты, их рейтинги и как они работают</summary>
    <div id="botsHelp"></div>
  </details>
</body>
</html>
